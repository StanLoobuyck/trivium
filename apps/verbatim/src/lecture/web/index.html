<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verbatim</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script>try { const th = localStorage.getItem("lt-theme"); if (th) document.documentElement.dataset.theme = th; } catch {}</script>
  <link rel="preload" href="/static/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/css/shell.css">
  <link rel="stylesheet" href="/static/css/library.css">
  <link rel="stylesheet" href="/static/css/lecture.css">
  <link rel="stylesheet" href="/static/css/setup.css">
  <link rel="stylesheet" href="/static/css/archive.css">
</head>
<body>
  <div class="shell">
    <nav class="side" id="side" aria-label="Main">
      <a class="side-brand" href="#/">
        <svg class="side-mark" viewBox="0 0 28 28" aria-hidden="true">
          <rect width="28" height="28" rx="7.5"/>
          <path d="M8 12v4M12 8.5v11M16 10.5v7M20 13v2"/>
        </svg>
        <span id="app-name">Verbatim</span>
      </a>
      <a class="side-add" href="#/add" data-t="nav_add"></a>
      <div id="side-nav"></div>
      <div class="side-foot">
        <div id="side-status"></div>
        <div class="side-prefs">
          <div class="lang" role="group" aria-label="Language">
            <button type="button" data-lang="nl">NL</button>
            <button type="button" data-lang="en">EN</button>
          </div>
          <button type="button" class="icon-btn theme-btn" id="theme-btn" data-t-title="theme" aria-label="Theme">
            <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>
          </button>
        </div>
      </div>
    </nav>

    <div class="page">
      <header class="pagebar">
        <a class="pagebar-back" href="#/">← <span data-t="back_library"></span></a>
        <button type="button" class="bar-title" id="bar-title"></button>
        <div class="bar-actions" id="bar-actions"></div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/static/i18n.js"></script>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
