<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Verbatim</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script>try { const th = localStorage.getItem("lt-theme"); if (th) document.documentElement.dataset.theme = th; } catch {}</script>
  <link rel="preload" href="/static/design/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/design/tokens.css">
  <link rel="stylesheet" href="/static/design/components.css">
  <link rel="stylesheet" href="/static/verbatim.css">
</head>
<body class="app">
  <div id="stage">
    <div id="shell" class="split">
      <div class="topbar" aria-hidden="true"></div>
      <aside class="sidebar" id="sidebar" aria-label="Main">
        <div class="side-brand"><img class="side-logo" src="/static/favicon.svg" alt="" width="28" height="28"><span id="app-name">Verbatim</span></div>
        <a class="btn btn-primary btn-block side-add" id="side-add" href="#/add"></a>
        <div class="side-scroll" id="side-nav"></div>
        <div class="side-models" id="side-status"></div>
        <ul class="list list-side" id="side-settings"></ul>
      </aside>
      <div id="scroller" class="view">
        <header class="navbar lecture-bar" id="lecture-bar">
          <a class="btn btn-plain lecture-back" href="#/" id="lecture-back"></a>
          <div class="lecture-bar-title" id="bar-title"></div>
          <div class="bar-actions" id="bar-actions"></div>
        </header>
        <main id="view" class="page" tabindex="-1"></main>
      </div>
      <nav class="tabbar" id="tabbar" data-active="0" aria-label="Main"></nav>
      <a class="fab" id="fab"></a>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="/static/i18n.js"></script>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
