[project]
name = "trivium-hub"
version = "0.1.0"
description = "Sync en rooster voor Sequo"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "httpx"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
