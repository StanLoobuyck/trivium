<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swiftskip</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="components.css" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="split">
      <aside class="sidebar" data-i18n-aria-label="settings">
        <div class="side-brand">
          <img class="side-logo" src="icons/icon48.png" alt="" width="28" height="28" />
          <span>Swiftskip</span>
        </div>
        <ul class="list list-side section-nav">
          <li>
            <a class="row" href="#general"
              ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
                <circle cx="16" cy="7" r="2" />
                <circle cx="8" cy="17" r="2" /></svg
              ><span class="row-main"><span data-i18n="general"></span></span
            ></a>
          </li>
          <li>
            <a class="row" href="#shortcuts"
              ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="6" width="18" height="12" rx="2.5" />
                <path d="M7 10h.01M11 10h.01M15 10h.01M7.5 14h9" /></svg
              ><span class="row-main"><span data-i18n="keyboardShortcuts"></span></span
            ></a>
          </li>
          <li>
            <a class="row" href="#links"
              ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1" />
                <path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1" /></svg
              ><span class="row-main"><span data-i18n="linksTitle"></span></span
            ></a>
          </li>
          <li>
            <a class="row" href="#sites"
              ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="8.5" />
                <path
                  d="M3.5 12h17M12 3.5c2.5 2.5 3.5 5.3 3.5 8.5s-1 6-3.5 8.5c-2.5-2.5-3.5-5.3-3.5-8.5s1-6 3.5-8.5z"
                /></svg
              ><span class="row-main"><span data-i18n="sites"></span></span
            ></a>
          </li>
          <li>
            <a class="row" href="#about"
              ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="8.5" />
                <path d="M12 11v5M12 8h.01" /></svg
              ><span class="row-main"><span data-i18n="about"></span></span
            ></a>
          </li>
        </ul>
      </aside>

      <main class="page">
        <div>
          <h1 class="large-title" data-i18n="settings"></h1>
          <p class="sub" id="version-line"></p>
        </div>

        <section class="pane" id="general" aria-labelledby="general-title">
          <h2 class="group-title" id="general-title" data-i18n="general"></h2>
          <div class="list">
            <div class="row">
              <div class="row-text">
                <label for="enabled" data-i18n="swiftskipOn"></label>
                <p class="label" id="enabled-desc" data-i18n="enabledDesc"></p>
              </div>
              <input
                class="switch"
                type="checkbox"
                id="enabled"
                role="switch"
                aria-describedby="enabled-desc"
              />
            </div>
            <div class="row">
              <div class="row-text">
                <span id="language-label" data-i18n="language"></span>
                <p class="label" id="language-desc" data-i18n="languageDesc"></p>
              </div>
              <div
                class="segmented segmented-compact"
                id="language-options"
                role="radiogroup"
                aria-labelledby="language-label"
                aria-describedby="language-desc"
              ></div>
            </div>
            <div class="row">
              <div class="row-text">
                <span id="theme-label" data-i18n="theme"></span>
                <p class="label" id="theme-desc" data-i18n="themeDesc"></p>
              </div>
              <div
                class="segmented segmented-compact"
                id="theme-options"
                role="radiogroup"
                aria-labelledby="theme-label"
                aria-describedby="theme-desc"
              ></div>
            </div>
            <div class="row">
              <div class="row-text">
                <span id="skip-label" data-i18n="skipInterval"></span>
                <p class="label" id="skip-desc" data-i18n="skipDesc"></p>
              </div>
              <div
                class="segmented segmented-compact"
                id="skip-options"
                role="radiogroup"
                aria-labelledby="skip-label"
                aria-describedby="skip-desc"
              ></div>
            </div>
            <div class="row">
              <div class="row-text">
                <span id="step-label" data-i18n="speedSteps"></span>
                <p class="label" id="step-desc" data-i18n="speedStepsDesc"></p>
              </div>
              <div
                class="segmented segmented-compact"
                id="step-options"
                role="radiogroup"
                aria-labelledby="step-label"
                aria-describedby="step-desc"
              ></div>
            </div>
            <div class="row">
              <div class="row-text">
                <label for="remember-speed" data-i18n="rememberSpeed"></label>
                <p class="label" id="remember-speed-desc"></p>
              </div>
              <input
                class="switch"
                type="checkbox"
                id="remember-speed"
                role="switch"
                aria-describedby="remember-speed-desc"
              />
            </div>
            <div class="row">
              <div class="row-text">
                <label for="resume" data-i18n="resume"></label>
                <p class="label">
                  <span id="resume-desc" data-i18n="resumeDesc"></span>
                  <button class="link" id="forget-positions" type="button" hidden></button>
                </p>
              </div>
              <input
                class="switch"
                type="checkbox"
                id="resume"
                role="switch"
                aria-describedby="resume-desc"
              />
            </div>
          </div>
        </section>

        <section class="pane" id="shortcuts" aria-labelledby="shortcuts-title">
          <div class="section-head">
            <h2 class="group-title" id="shortcuts-title" data-i18n="keyboardShortcuts"></h2>
            <button
              class="btn btn-small btn-plain"
              id="reset-shortcuts"
              type="button"
              data-i18n="resetDefaults"
            ></button>
          </div>
          <p class="section-intro label" data-i18n="shortcutsIntro"></p>
          <p class="banner notice" id="shortcut-notice" role="status" aria-live="polite" hidden></p>
          <div id="shortcut-groups"></div>
        </section>

        <section class="pane" id="links" aria-labelledby="links-title">
          <h2 class="group-title" id="links-title" data-i18n="linksTitle"></h2>
          <div class="list">
            <div class="row" id="inhaal">
              <div class="row-text">
                <span id="inhaal-title">Inhaal</span>
                <p class="label" id="inhaal-text"></p>
                <p class="label" id="inhaal-notice" role="status" aria-live="polite" hidden></p>
              </div>
              <button class="btn btn-small btn-primary" id="inhaal-link" type="button" hidden></button>
              <button class="btn btn-small" id="inhaal-unlink" type="button" hidden></button>
            </div>
            <div class="row">
              <div class="row-text">
                <label for="downloads-verbatim" data-i18n="downloadsToVerbatim"></label>
                <p class="label" id="downloads-verbatim-desc" data-i18n="downloadsToVerbatimDesc"></p>
              </div>
              <input
                class="switch"
                type="checkbox"
                id="downloads-verbatim"
                role="switch"
                aria-describedby="downloads-verbatim-desc"
              />
            </div>
          </div>
        </section>

        <section class="pane" id="sites" aria-labelledby="sites-title">
          <h2 class="group-title" id="sites-title" data-i18n="sites"></h2>
          <p class="section-intro label" data-i18n="sitesIntro"></p>
          <ul class="list" id="site-list"></ul>
        </section>

        <section class="pane" id="about" aria-labelledby="about-title">
          <h2 class="group-title" id="about-title" data-i18n="about"></h2>
          <div class="card about">
            <p class="sub" data-i18n="aboutText"></p>
            <p class="links">
              <a
                href="https://github.com/StanLoobuyck/SwiftSkip/issues/new"
                target="_blank"
                rel="noopener"
                data-i18n="reportProblem"
              ></a>
              <a
                href="https://github.com/StanLoobuyck/SwiftSkip"
                target="_blank"
                rel="noopener"
                data-i18n="sourceCode"
              ></a>
              <a
                href="https://github.com/StanLoobuyck/SwiftSkip/blob/main/PRIVACY.md"
                target="_blank"
                rel="noopener"
                data-i18n="privacy"
              ></a>
            </p>
          </div>
        </section>
      </main>
    </div>
    <script src="options.js"></script>
  </body>
</html>
