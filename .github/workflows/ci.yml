name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pinned to 24.04 (ubuntu-latest became 26.04 on 2026-11-01); apt never asks questions.
env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  # Only test what a push touches (owner, 2026-11-12: waiting on every job ate his time). A change to this file
  # runs everything.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sequo: ${{ steps.f.outputs.sequo }}
      hub: ${{ steps.f.outputs.hub }}
      velox: ${{ steps.f.outputs.velox }}
      verbatim: ${{ steps.f.outputs.verbatim }}
      installer: ${{ steps.f.outputs.installer }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            all: &all
              - .github/workflows/ci.yml
            sequo:
              - *all
              - apps/sequo/**
              - packages/**
              - site/**
              - scripts/**
              - fixtures/**
              - package.json
              - package-lock.json
              - playwright.config.js
              - vitest.config.js
            hub:
              - *all
              - apps/hub/**
              - packages/contract/**
            velox:
              - *all
              - apps/velox/**
              - packages/design/**
            verbatim:
              - *all
              - apps/verbatim/**
              - packages/design/**
            installer:
              - *all
              - apps/verbatim/src/**
              - apps/verbatim/packaging/**
              - apps/verbatim/pyproject.toml
              - apps/verbatim/uv.lock

  sequo:
    needs: changes
    if: needs.changes.outputs.sequo == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npm test
      - run: npm run build
      # azure.archive.ubuntu.com timed out on every package (2026-11-11): use Ubuntu's own server (the runner reads it from apt-mirrors.txt).
      - run: sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  hub:
    needs: changes
    if: needs.changes.outputs.hub == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project apps/hub pytest apps/hub/tests -q

  velox:
    needs: changes
    if: needs.changes.outputs.velox == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/velox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/velox/package-lock.json
      - run: npm ci
      # Echte TS-naar-MP4-test en testmedia voor de lokale pagina's.
      # azure.archive.ubuntu.com timed out on every package (2026-11-11): use Ubuntu's own server (the runner reads it from apt-mirrors.txt).
      - run: sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  verbatim:
    needs: changes
    if: needs.changes.outputs.verbatim == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/verbatim
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # azure.archive.ubuntu.com timed out on every package (2026-11-11): use Ubuntu's own server (the runner reads it from apt-mirrors.txt).
      - run: sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: uv run pytest -q

  # Verbatim draait ook op Windows (voor gebruikers zonder Linux).
  verbatim-windows:
    needs: changes
    if: needs.changes.outputs.verbatim == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/verbatim
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: choco install ffmpeg -y --no-progress
      - run: uv run pytest -q

  # The Windows installer: built, installed silently on a clean machine and tried (packaging/windows/).
  # Runs next to the unit tests instead of after them (saves ~3 min).
  verbatim-installer:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/verbatim
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: ./packaging/windows/build.ps1
      - run: ./packaging/windows/test-install.ps1
      # test-standard-user.ps1 is not run: Setup can't start as another user in GitHub's service session, so it
      # proved nothing (2026-11-12). The real test is a laptop with an ordinary double-click.
      - name: Update over the published version
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/windows/test-upgrade.ps1
      # The G14 case (2026-11-12): 0.2.1 still running while a double-clicked Setup replaces its environment.
      - name: Update from 0.2.1 while it runs, double-clicked
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/windows/test-upgrade.ps1 -From verbatim-v0.2.1 -Manual
      - uses: actions/upload-artifact@v4
        with:
          name: verbatim-windows-installer
          path: apps/verbatim/dist/Verbatim-Setup-*.exe
          retention-days: 30

  deploy:
    # Only when the site was built (sequo ran); a skipped hub doesn't block it, a failed one does
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.sequo.result == 'success' && needs.hub.result != 'failure'
    needs: [sequo, hub]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
