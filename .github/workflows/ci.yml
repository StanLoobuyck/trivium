name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pinned to 24.04 (ubuntu-latest became 26.04 on 2026-11-01); apt never asks questions.
env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  sequo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npm test
      - run: npm run build
      # azure.archive.ubuntu.com timed out on every package (2026-11-11): use Ubuntu's own server (the runner reads it from apt-mirrors.txt).
      - run: sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  hub:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project apps/hub pytest apps/hub/tests -q

  velox:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/velox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/velox/package-lock.json
      - run: npm ci
      # Echte TS-naar-MP4-test en testmedia voor de lokale pagina's.
      # azure.archive.ubuntu.com timed out on every package (2026-11-11): use Ubuntu's own server (the runner reads it from apt-mirrors.txt).
      - run: sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  verbatim:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/verbatim
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # azure.archive.ubuntu.com timed out on every package (2026-11-11): use Ubuntu's own server (the runner reads it from apt-mirrors.txt).
      - run: sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: uv run pytest -q

  # Verbatim draait ook op Windows (voor gebruikers zonder Linux).
  verbatim-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/verbatim
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: choco install ffmpeg -y --no-progress
      - run: uv run pytest -q

  # The Windows installer: built, installed silently on a clean machine and tried (packaging/windows/).
  verbatim-installer:
    needs: verbatim-windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/verbatim
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: ./packaging/windows/build.ps1
      - run: ./packaging/windows/test-install.ps1
      # One-off (2026-11-12): the published 0.2.1 must FAIL here (os error 448), proving the test catches it.
      - name: Reproduce with 0.2.1 (expected to fail)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download verbatim-v0.2.1 --repo StanLoobuyck/trivium --pattern "Verbatim-Setup-*.exe" --dir $env:RUNNER_TEMP\old
          ./packaging/windows/test-standard-user.ps1 -Installer (Get-ChildItem $env:RUNNER_TEMP\old -Filter *.exe).FullName
      - run: ./packaging/windows/test-standard-user.ps1
      - name: Update over the published version
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/windows/test-upgrade.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: verbatim-windows-installer
          path: apps/verbatim/dist/Verbatim-Setup-*.exe
          retention-days: 30

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [sequo, hub]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
